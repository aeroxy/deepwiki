[package]
name = "deepwiki"
version = "0.1.0"
edition = "2021"
description = "CLI for DeepWiki — query GitHub repo wikis (structure, full markdown, Q&A) via MCP without a browser. Built for LLM coding agents and humans."
authors = ["Aero <aero.windwalker@gmail.com>"]
license = "MIT"
repository = "https://github.com/aeroxy/deepwiki"
homepage = "https://github.com/aeroxy/deepwiki"
keywords = ["deepwiki", "github", "wiki", "mcp", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[[bin]]
name = "deepwiki"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
reqwest = { version = "0.13", features = ["rustls"] }
rmcp = { version = "1", features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
